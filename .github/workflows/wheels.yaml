name: Python wheels

on:
  release:
    types:
      - published
  workflow_dispatch:
  issue_comment:
    types:
      - created

jobs:
  create_sdist:
    name: Create 🐍 sdist
    if: ${{ (startsWith(github.event.comment.body, '/build_wheels') && github.event.issue.pull_request) || github.event_name == 'workflow_dispatch' || github.event_name == 'release' }}
    runs-on: ubuntu-24.04

    steps:
      # ref: https://github.com/actions/checkout/issues/331#issuecomment-707103442
      - name: Get pull request
        if: ${{ github.event.issue.pull_request }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: get-pr
        with:
          script: |
            const request = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            };
            core.info(`Getting PR #${request.pull_number} from ${request.owner}/${request.repo}`);
            try {
              const result = await github.rest.pulls.get(request);
              return result.data;
            } catch (err) {
              core.setFailed(`Request failed with error ${err}`);
            }

      - name: Checkout MR
        if: ${{ github.event.issue.pull_request }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(steps.get-pr.outputs.result).head.repo.full_name }}
          ref: ${{ fromJSON(steps.get-pr.outputs.result).head.sha }}
          submodules: true

      - name: Checkout
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'release' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Disable local version for TestPyPI upload
        if: github.event_name == 'workflow_dispatch'
        run: echo SETUPTOOLS_SCM_OVERRIDES_FOR_OVERLAP='{ local_scheme = "no-local-version" }' >> "$GITHUB_ENV"
        shell: bash

      - name: Trigger response
        if: ${{ github.event.issue.pull_request }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: trigger-response
        with:
          script: |
            const msg = 'Triggered [building of 🐍 sdist](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) via action...';
            try {
              const result = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: msg,
              });
              return result.data;
            } catch (err) {
              core.setFailed(`Request failed with error ${err}`);
            }
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Dependencies
        run: python -m pip install build twine

      - name: Create sdist
        id: build-sdist
        run: python -m build --sdist

      - name: Check metadata
        id: check-metadata
        run: twine check dist/*

      - name: Notify via comment
        if: ${{ github.event.issue.pull_request }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STEP_STATUS: ${{steps.check-metadata.outcome}}
        with:
          script: |
            try {
              const result = await github.rest.issues.getComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: ${{ fromJSON(steps.trigger-response.outputs.result).id }},
              });

              let msg = result.data.body;
              if(process.env.STEP_STATUS == 'success') {
                msg += 'successful :heavy_check_mark:';
              } else {
                msg += 'failed :x:';
              }

              github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: ${{ fromJSON(steps.trigger-response.outputs.result).id }},
                body: msg,
              });
            } catch (err) {
              core.setFailed(`Request failed with error ${err}`);
            }

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event.repository.name }}-sdist
          path: dist/*.tar.gz
          retention-days: 2

  build_wheels:
    name: Build 🐍 wheels on ${{ matrix.os }}
    if: ${{ (startsWith(github.event.comment.body, '/build_wheels') && github.event.issue.pull_request) || github.event_name == 'workflow_dispatch' || github.event_name == 'release' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2022]

    steps:
      # ref: https://github.com/actions/checkout/issues/331#issuecomment-707103442
      - name: Get pull request
        if: ${{ github.event.issue.pull_request }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: get-pr
        with:
          script: |
            const request = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            };
            core.info(`Getting PR #${request.pull_number} from ${request.owner}/${request.repo}`);
            try {
              const result = await github.rest.pulls.get(request);
              return result.data;
            } catch (err) {
              core.setFailed(`Request failed with error ${err}`);
            }

      - name: Checkout MR
        if: ${{ github.event.issue.pull_request }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(steps.get-pr.outputs.result).head.repo.full_name }}
          ref: ${{ fromJSON(steps.get-pr.outputs.result).head.sha }}
          submodules: true

      - name: Checkout
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'release' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Trigger response
        if: ${{ github.event.issue.pull_request }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: trigger-response
        with:
          script: |
            const msg = 'Triggered [building of 🐍 wheels on ${{ matrix.os }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) via action...';
            try {
              const result = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: msg,
              });
              return result.data;
            } catch (err) {
              core.setFailed(`Request failed with error ${err}`);
            }

      - name: Disable local version for TestPyPI upload
        if: github.event_name == 'workflow_dispatch'
        run: echo SETUPTOOLS_SCM_OVERRIDES_FOR_OVERLAP='{ local_scheme = "no-local-version" }' >> "$GITHUB_ENV"
        shell: bash

      - name: Build wheels
        id: build-wheels
        uses: pypa/cibuildwheel@4726cd35bb13f7bde50cf2761f2499ac7b3aa32c # v4.1.1
        with:
          output-dir: dist

      - name: Build Pyodide wheels
        if: matrix.os == 'ubuntu-24.04'
        uses: pypa/cibuildwheel@4726cd35bb13f7bde50cf2761f2499ac7b3aa32c # v4.1.1
        env:
          CIBW_PLATFORM: pyodide
        with:
          output-dir: dist

      - name: Notify via comment
        if: ${{ github.event.issue.pull_request }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STEP_STATUS: ${{ steps.build-wheels.outcome }}
        with:
          script: |
            try {
              const result = await github.rest.issues.getComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: ${{ fromJSON(steps.trigger-response.outputs.result).id }},
              });

              let msg = result.data.body;
              if(process.env.STEP_STATUS == 'success') {
                msg += 'successful :heavy_check_mark:';
              } else {
                msg += 'failed :x:';
              }

              github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: ${{ fromJSON(steps.trigger-response.outputs.result).id }},
                body: msg,
              });
            } catch (err) {
              core.setFailed(`Request failed with error ${err}`);
            }

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event.repository.name }}-wheels-${{ matrix.os }}
          path: ./dist/*.whl
          retention-days: 2

  publish:
    name: Upload release to PyPI
    needs: [create_sdist, build_wheels]
    runs-on: ubuntu-24.04
    environment: ${{ github.event_name == 'release' && github.event.action == 'published' && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write
      attestations: write
      contents: read

    steps:
      - name: Download sdist/wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ github.event.repository.name }}-*
          path: dist
          merge-multiple: true

        # PyPI does not support publishing of Pyodide wheels yet
      - name: Remove Pyodide wheels
        run: rm dist/*pyodide*.whl || true
        shell: bash

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*"

      - name: Publish package to TestPyPI
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish package to PyPI
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
