name: SonarCloud

on:
  workflow_call:

jobs:
  analyze:
    name: Build and analyze
    runs-on: ubuntu-26.04
    env:
      BUILD_WRAPPER_OUT_DIR: build_wrapper_output_directory
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          activate-environment: true

      - name: Dependencies
        run: |
          sudo apt update && sudo apt install -y clang-21 llvm-21 libeigen3-dev
          uv sync --frozen --no-build --only-group coverage

      - name: Install SonarSource build-wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5

      - name: Run build wrapper
        run: |
          cmake \
            -Bbuild \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-21 \
            -DCMAKE_CXX_COMPILER=clang++-21 \
            -DOVERLAP_WITH_COVERAGE=ON
          build-wrapper-linux-x86-64 \
            --out-dir ${{ env.BUILD_WRAPPER_OUT_DIR }} \
            cmake --build build --config Debug --parallel 4

      - name: Run tests and collect coverage information
        run: |
          cd build
          ctest --output-on-failure
          gcovr \
            --gcov-executable 'llvm-cov-21 gcov' \
            --exclude-lines-by-pattern '.*overlap_assert.*' \
            --merge-lines \
            --sonarqube coverage.xml \
            -r ../ \
            -e ../third_party/ -e ../tests/src

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            --define sonar.cfamily.compile-commands=${{ env.BUILD_WRAPPER_OUT_DIR }}/compile_commands.json
            --define sonar.coverageReportPaths=./build/coverage.xml
