name: SonarCloud

on:
  workflow_call:

jobs:
  analyze:
    name: Build and analyze
    runs-on: ubuntu-26.04
    env:
      BUILD_WRAPPER_OUT_DIR: build_wrapper_output_directory
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - name: Dependencies
        run: |
          sudo apt update && sudo apt install -y clang-21 llvm-21 libeigen3-dev
          # https://github.com/gcovr/gcovr/issues/1228
          python -m pip install gcovr==8.4

      - name: Install SonarSource build-wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2

      - name: Run build wrapper
        run: |
          cmake \
            -Bbuild \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-21 \
            -DCMAKE_CXX_COMPILER=clang++-21 \
            -DOVERLAP_WITH_COVERAGE=ON
          build-wrapper-linux-x86-64 \
            --out-dir ${{ env.BUILD_WRAPPER_OUT_DIR }} \
            cmake --build build --config Debug

      - name: Run tests and collect coverage information
        run: |
          cd build
          ctest --output-on-failure
          ~/.local/bin/gcovr \
            --gcov-executable 'llvm-cov-21 gcov' \
            --exclude-lines-by-pattern '.*overlap_assert.*' \
            --sonarqube coverage.xml \
            -r ../ \
            -e ../third_party/ -e ../tests/src

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            --define sonar.cfamily.compile-commands=${{ env.BUILD_WRAPPER_OUT_DIR }}/compile_commands.json
            --define sonar.coverageReportPaths=./build/coverage.xml
