name: CI Python Linux

on:
  - pull_request

jobs:
  build:
    name: "🐍 ${{ matrix.os-name }} - Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: "ubuntu-24.04", os-name: "Ubuntu 24.04", python-version: "3.9" }
          - { os: "ubuntu-26.04", os-name: "Ubuntu 26.04", python-version: "3.10" }
          - { os: "ubuntu-26.04", os-name: "Ubuntu 26.04", python-version: "3.11" }

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Dependencies
        run: |
          sudo apt install libeigen3-dev
          python -m pip install pytest

      - name: Install
        run: |
          python -m pip install -v .

      - name: Test
        run: |
          pytest
