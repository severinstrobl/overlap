name: Python build and test 🐧

on:
  workflow_call:

jobs:
  build:
    name: "🐍 Ubuntu 24.04 ${{ endsWith(matrix.os, 'arm') && 'AArch64' || 'x86-64' }} - Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04", "ubuntu-24.04-arm"]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup Python ${{ matrix.python-version }} and uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Dependencies
        run: |
          sudo apt install libeigen3-dev

      - name: Install
        run: |
          uv sync --frozen --no-build --no-editable --group test

      - name: Test
        run: |
          python -m pytest -vs
